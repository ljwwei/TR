name: Collect TDX TRA Punctuality Data

on:
  schedule:
    # 全天候 24 小時每 30 分鐘採集一次（涵蓋深夜末班車、跨日／跨夜班次、清晨首班車與嚴重誤點列車）
    # 每日 48 次 × 30 天 = 1,440 次/月（約 0.96 點呼叫 + 流量合計約 1.6~2.1 點，仍在基礎會員免費 3 點內）
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "抓取範圍（all = 全臺車站；major = 本島 19 縣市主要車站）"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - major

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "tdx-collect"
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.commit.outputs.deploy }}
    steps:
      - name: Checkout collector scripts (main)
        uses: actions/checkout@v4
        with:
          path: app

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare tdx-data orphan branch
        run: |
          mkdir -p data_repo
          cd data_repo
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads origin tdx-data >/dev/null 2>&1; then
            git fetch --depth 1 origin tdx-data
            git checkout -B tdx-data FETCH_HEAD
          else
            git checkout --orphan tdx-data
          fi

      - name: Run TDX TRA data collector
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
          DATA_DIR: data_repo
          COLLECT_SCOPE: ${{ github.event.inputs.scope || vars.COLLECT_SCOPE || 'all' }}
          MAX_MONTHLY_POINTS: ${{ vars.MAX_MONTHLY_POINTS || '2.75' }}
        run: |
          python3 app/scripts/collect_tdx.py

      - name: Commit and push updated static data
        id: commit
        run: |
          cd data_repo
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            if git diff --cached --name-only | grep -Eq '^(daily/|monthly/|yearly/|stations\.json)'; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "deploy=false" >> "$GITHUB_OUTPUT"
            fi
            git commit -m "chore(data): update TDX TRA snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin tdx-data
          else
            echo "No data changes detected."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: collect
    if: needs.collect.outputs.deploy == 'true'
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
